steps:
  - name: 'europe-west1-docker.pkg.dev/$PROJECT_ID/ci-containers/antigravity-runner:latest'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        antigravity run \
          --prompt "$_ISSUE_BODY" \
          --workspace /workspace/ \
          --max-iterations 15 \
          --auto-commit "Fix: $_ISSUE_TITLE" \
          --create-pr \
          --headless
    env:
      - 'GEMINI_API_KEY=$_GEMINI_API_KEY'
      - 'GITHUB_TOKEN=$_GITHUB_TOKEN'

timeout: '2700s'

options:
  machineType: 'E2_HIGHCPU_8'
